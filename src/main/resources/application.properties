spring.application.name=blank
server.port=8081

# PostgreSQL (AWS RDS) datasource
spring.datasource.url=jdbc:postgresql://database-iot.c7oewgusah9l.ap-southeast-1.rds.amazonaws.com:5432/face_recog_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto chi ap len bang `devices` — identities/recognition_logs do backend Python (db_utils.py) so huu,
# Hibernate khong duoc create/update de tranh schema drift (mat default now(), thieu cot embedding)
spring.jpa.properties.hibernate.hbm2ddl.schema_filter_provider=com.example.blank.config.DevicesOnlySchemaFilterProvider

# --- ESP32 orchestrator (Luong 1-5) ---
recognition.base-url=http://backend-service:8080
recognition.connect-timeout=PT5S
recognition.enroll-timeout=PT20S
recognition.recognize-timeout=PT10S
provisioning.secret=${PROVISIONING_SECRET: d5ea50d941c14e238e352c11064385eefbf3e9f10edd7aa1}
enroll.image-count=5
enroll.timeout=PT30S
enroll.priority-wait=PT10S
device.image.max-base64-length=400000
device.key.max-age=PT24H
device.key.rotation-check-ms=3600000
device.register.rate-limit.max=10
device.register.rate-limit.window-ms=60000

# Giới hạn upload: mỗi file và tổng request không quá 50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB