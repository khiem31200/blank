<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách định danh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #334155; --muted: #64748b; --line: #e8eaee;
            --surface: #ffffff; --bg: #f6f7f9; --accent: #5b6b82;
        }
        body { background: var(--bg); color: var(--ink); }
        .app-header {
            background: var(--surface); border-bottom: 1px solid var(--line);
        }
        .app-header .navbar-brand { font-weight: 600; color: var(--ink) !important; }
        .app-header .brand-badge {
            width: 34px; height: 34px; border-radius: 10px; background: #eef1f5; color: var(--accent);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .card { border: 1px solid var(--line); border-radius: 14px; }
        .shadow-soft { box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06); }
        .stat-icon {
            width: 48px; height: 48px; border-radius: 12px; background: #eef1f5; color: var(--accent);
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .table-hover tbody tr { cursor: pointer; }
        .table-hover tbody tr:hover { background: #f3f5f8; }
        .table > :not(caption) > * > * { padding: .85rem 1rem; }
        thead.table-soft th {
            background: #f8f9fb; color: var(--muted); font-weight: 600;
            font-size: 12px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--line);
        }
        .avatar {
            width: 38px; height: 38px; border-radius: 10px; flex: 0 0 38px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; color: var(--accent); font-size: 14px; background: #eef1f5;
        }
        .thumb {
            width: 44px; height: 44px; border-radius: 10px; flex: 0 0 44px;
            object-fit: cover; background: #eef1f5; cursor: zoom-in;
            border: 1px solid var(--line); transition: transform .12s ease, box-shadow .12s ease;
        }
        .thumb:hover { transform: scale(1.06); box-shadow: 0 2px 8px rgba(16,24,40,.18); }
        /* Lightbox */
        #lightbox {
            position: fixed; inset: 0; z-index: 1080; display: none;
            align-items: center; justify-content: center;
            background: rgba(15,23,42,.82); padding: 24px; cursor: zoom-out;
        }
        #lightbox.show { display: flex; }
        #lightbox img {
            max-width: min(90vw, 720px); max-height: 90vh; border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #fff;
        }
        #lightbox .lb-close {
            position: absolute; top: 18px; right: 22px; color: #fff; font-size: 30px;
            line-height: 1; cursor: pointer; opacity: .85;
        }
        #lightbox .lb-close:hover { opacity: 1; }
        .count-pill {
            background: #eef1f5; color: var(--accent); font-weight: 600;
            border-radius: 999px; padding: .2rem .7rem; font-size: .8rem;
        }
        .search-box { max-width: 300px; }
        .search-box .input-group-text, .search-box .form-control { background: #f8f9fb; }
        .search-box .form-control:focus { background: #fff; box-shadow: none; border-color: #cdd4de; }
    </style>
</head>
<body>
<header class="app-header">
    <nav class="navbar">
        <div class="container">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center">
                <span class="brand-badge me-2"><i class="bi bi-person-bounding-box"></i></span>
                Hệ thống nhận diện khuôn mặt
            </span>
        </div>
    </nav>
</header>

<div class="container py-4">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show shadow-soft border-0" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${message}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-warning alert-dismissible fade show shadow-soft border-0" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}">Lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-4">
            <div class="card stat-card shadow-soft h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="stat-icon me-3"><i class="bi bi-people"></i></div>
                    <div>
                        <div class="text-muted small">Định danh đã đăng ký</div>
                        <div class="fs-3 fw-semibold" th:text="${#lists.size(identities)}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card table-card shadow-soft">
        <div class="card-header bg-white d-flex align-items-center justify-content-between flex-wrap gap-2 py-3 border-bottom-0">
            <h1 class="h6 mb-0 fw-semibold"><i class="bi bi-list-ul me-2 text-secondary"></i>Danh sách định danh</h1>
            <div class="input-group input-group-sm search-box">
                <span class="input-group-text border-end-0 text-muted"><i class="bi bi-search"></i></span>
                <input id="searchInput" type="text" class="form-control border-start-0"
                       placeholder="Tìm theo tên..." aria-label="Tìm theo tên" oninput="filterRows()">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-soft">
                <tr>
                    <th scope="col" style="width: 80px;">ID</th>
                    <th scope="col">Tên</th>
                    <th scope="col" style="width: 230px;">Thời gian tạo</th>
                    <th scope="col" style="width: 50px;"></th>
                </tr>
                </thead>
                <tbody id="identityTable">
                <tr th:if="${#lists.isEmpty(identities)}">
                    <td colspan="4" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>Chưa có định danh nào.
                    </td>
                </tr>
                <tr th:each="identity : ${identities}"
                    th:onclick="|window.location.href='@{/view/registers/{id}(id=${identity.id})}'|">
                    <td class="text-muted">#<span th:text="${identity.id}">1</span></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <img th:if="${identity.imageUrl != null and !identity.imageUrl.isEmpty()}"
                                 class="thumb me-3" th:src="${identity.imageUrl}"
                                 th:alt="${identity.name}" loading="lazy"
                                 th:attr="data-full=${identity.imageUrl},data-name=${identity.name}"
                                 onclick="event.stopPropagation(); openLightbox(this);">
                            <div th:unless="${identity.imageUrl != null and !identity.imageUrl.isEmpty()}"
                                 class="avatar me-3"
                                 th:text="${#strings.toUpperCase(#strings.substring(identity.name,0,1))}">A</div>
                            <span class="fw-medium name-cell" th:text="${identity.name}">Tên</span>
                        </div>
                    </td>
                    <td class="text-muted">
                        <i class="bi bi-clock-history me-1"></i>
                        <span th:text="${identity.createdAt != null ? #temporals.format(identity.createdAt, 'dd/MM/yyyy HH:mm:ss') : ''}">--</span>
                    </td>
                    <td class="text-end text-muted"><i class="bi bi-chevron-right"></i></td>
                </tr>
                <tr id="noResult" class="d-none">
                    <td colspan="4" class="text-center text-muted py-4">Không tìm thấy định danh phù hợp.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small mt-2 mb-0">
        <i class="bi bi-info-circle me-1"></i>Nhấp vào một dòng để xem lịch sử nhận diện của định danh đó.
    </p>
</div>

<!-- Lightbox phóng to ảnh -->
<div id="lightbox" onclick="closeLightbox()">
    <span class="lb-close" aria-label="Đóng">&times;</span>
    <img id="lightboxImg" src="" alt="" onclick="event.stopPropagation()">
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openLightbox(el) {
        const box = document.getElementById('lightbox');
        const img = document.getElementById('lightboxImg');
        img.src = el.getAttribute('data-full') || el.src;
        img.alt = el.getAttribute('data-name') || '';
        box.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('show');
        document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    function filterRows() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const rows = document.querySelectorAll('#identityTable tr[onclick]');
        let visible = 0;
        rows.forEach(row => {
            const name = row.querySelector('.name-cell')?.textContent.toLowerCase() || '';
            const show = name.includes(q);
            row.classList.toggle('d-none', !show);
            if (show) visible++;
        });
        document.getElementById('noResult').classList.toggle('d-none', visible !== 0 || rows.length === 0);
    }
</script>
</body>
</html>
