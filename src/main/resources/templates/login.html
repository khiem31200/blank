<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="login-page">
        <div class="card login-card shadow-soft">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="login-brand">
                        <i class="bi bi-person-bounding-box"></i>
                    </div>
                    <h3 class="fw-bold mb-2">Hệ thống nhận diện khuôn mặt</h3>
                    <p class="muted-label mb-0">Đăng nhập để tiếp tục quản lý và theo dõi định danh</p>
                </div>

                <div class="alert alert-danger border-0" th:if="${error}" th:text="${error}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tài khoản</label>
                        <input type="text" name="username" class="form-control" placeholder="Nhập tài khoản" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
